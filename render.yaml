services:
  - type: web
    name: gaertner-homepage
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Mit nur einem Worker darf kein request-basierter Zwangsneustart aktiv sein:
    # waehrend des Recycles war der Dienst sonst kurz ohne erreichbaren Worker.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 app:app
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_SITE_ONLY
        value: true
      - key: PUBLIC_SITE_INDEXABLE
        value: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUBLIC_HOSTS
        value: auto-lackierzentrum.de,www.auto-lackierzentrum.de
      - key: DATENSCHUTZ_RECHTLICH_FREIGEGEBEN
        value: true
      - key: PORTAL_BASE_URL
        sync: false
      - key: ANALYTICS_INGEST_URL
        value: https://kundenstatus-app.onrender.com/api/besucher
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: REQUIRE_POSTGRES_ON_RENDER
        value: false
      - key: DATA_DIR
        value: /tmp/gaertner-public
      - key: UPLOAD_DIR
        value: /tmp/gaertner-public/uploads
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_PLACES_PLACE_ID
        sync: false

  - type: web
    name: kundenstatus-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Mit nur einem Worker darf kein request-basierter Zwangsneustart aktiv sein.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 app:app
    healthCheckPath: /healthz
    disk:
      name: kundenstatus-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PUBLIC_SITE_ONLY
        value: false
      - key: PUBLIC_SITE_INDEXABLE
        value: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUBLIC_HOSTS
        value: auto-lackierzentrum.de,www.auto-lackierzentrum.de
      - key: DATENSCHUTZ_RECHTLICH_FREIGEGEBEN
        value: true
      - key: ADMIN_PASS
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: kundenstatus-db
          property: connectionString
      - key: REQUIRE_POSTGRES_ON_RENDER
        value: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_CAMPAIGN_ID_AUTO_LACKIERZENTRUM
        sync: false
      - key: GOOGLE_ADS_CAMPAIGN_ID_TOMORROWWORKS
        sync: false
      - key: GOOGLE_ADS_CAMPAIGN_ID_AUTOVERMIETUNG_MOS
        sync: false
      - key: GOOGLE_ADS_API_VERSION
        value: v25
      - key: GOOGLE_ADS_AUTO_SYNC_ENABLED
        value: true
      - key: GOOGLE_ADS_SYNC_INTERVAL_SECONDS
        value: 86400
      - key: GOOGLE_ADS_SYNC_LOOKBACK_DAYS
        value: 90
      - key: FAHRZEUGEINKAUF_SCANNER_API_TOKEN
        sync: false
      - key: OPENAI_EXTRACTION_MODEL
        value: gpt-4o
      - key: AUTO_BACKUP_ON_STARTUP
        value: true
      - key: DATA_DIR
        value: /var/data
      - key: SQLITE_DB_PATH
        value: /var/data/auftraege.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups

databases:
  - name: kundenstatus-db
    databaseName: kundenstatus
    user: kundenstatus
