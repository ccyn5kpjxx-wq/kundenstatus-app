name: GaertnerMitarbeiter
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
packages:
  GaertnerCore:
    path: GaertnerCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""
targets:
  GaertnerMitarbeiter:
    type: application
    platform: iOS
    sources:
      - path: GaertnerMitarbeiter
    dependencies:
      - package: GaertnerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gaertner.mitarbeiter.dev
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: GaertnerMitarbeiter/Info.plist
      properties:
        CFBundleDisplayName: Gärtner
        NSCameraUsageDescription: Fotografiere Material oder scanne eine Auftragsnummer. Die Kamera startet nur auf deinen Wunsch.
        NSMicrophoneUsageDescription: Sprich mit deinem Werkstatt-Assistenten. Das Mikrofon wird für dein gestartetes Gespräch benötigt.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  GaertnerMitarbeiter:
    build:
      targets:
        GaertnerMitarbeiter: all
    run:
      config: Debug
    archive:
      config: Release
