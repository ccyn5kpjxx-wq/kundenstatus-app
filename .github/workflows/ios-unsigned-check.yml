name: iOS unsigned check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show build tools
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          python3 - <<'PY'
          import subprocess
          xcode = subprocess.check_output(['xcodebuild', '-version'], text=True).splitlines()[0].split()[1]
          sdk = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], text=True).strip()
          assert int(xcode.split('.')[0]) >= 26, 'Xcode 26 or newer is required'
          assert int(sdk.split('.')[0]) >= 26, 'iOS 26 SDK or newer is required'
          print('Verified Xcode', xcode, 'and iOS SDK', sdk)
          PY
      - name: Core URL and QR safety tests
        working-directory: native/ios/GaertnerCore
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate --spec project.yml
      - name: Build for simulator without signing
        working-directory: native/ios
        run: >-
          xcodebuild -project GaertnerMitarbeiter.xcodeproj
          -scheme GaertnerMitarbeiter -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch fresh simulator and capture generic login screen
        working-directory: native/ios
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          candidates = [device for runtime, devices in inventory['devices'].items()
                        if runtime.endswith('.iOS-26-2') for device in devices
                        if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iOS 26.2 iPhone simulator; no fallback to an older runtime')
          device = candidates[0]
          simulator_id = device['udid']
          print('Simulator:', device['name'])
          try:
              subprocess.run(['xcrun','simctl','boot',simulator_id], check=True, timeout=120)
              subprocess.run(['xcrun','simctl','bootstatus',simulator_id,'-b'], check=True, timeout=240)
              subprocess.run(['xcrun','simctl','install',simulator_id,'build/Build/Products/Debug-iphonesimulator/GaertnerMitarbeiter.app'], check=True, timeout=120)
              subprocess.run(['xcrun','simctl','launch',simulator_id,'de.gaertner.mitarbeiter.dev'], check=True, timeout=120)
              time.sleep(10)
              subprocess.run(['xcrun','simctl','io',simulator_id,'screenshot','build/prototype-iphone.png'], check=True, timeout=60)
          finally:
              subprocess.run(['xcrun','simctl','shutdown',simulator_id], check=False, timeout=60)
          PY
      - name: Save generic prototype screenshot
        uses: actions/upload-artifact@v4
        with:
          name: iphone-prototype-screenshot
          path: native/ios/build/prototype-iphone.png
          retention-days: 3
