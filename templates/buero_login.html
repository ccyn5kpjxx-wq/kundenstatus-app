<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Büro anmelden · Gärtner</title></head><body class="buero-page">{% include 'buero_nav.html' %}<main class="buero-main buero-login"><p class="buero-eyebrow">PERSÖNLICHER ZUGANG</p><h1>Im Büro anmelden</h1><p>Nutze deine Mitarbeiter-ID und dein persönliches Passwort.</p>
{% for category,message in get_flashed_messages(with_categories=true) %}<p role="alert">{{ message }}</p>{% endfor %}
<form method="post" action="{{ url_for('assistent.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="/werkstatt/buero"><label for="buero-mid">Mitarbeiter-ID</label><input id="buero-mid" name="mitarbeiter_id" inputmode="numeric" autocomplete="username" required><label for="buero-pass">Persönliches Passwort</label><input id="buero-pass" name="password" type="password" autocomplete="current-password" required><button type="submit">Anmelden</button></form><p class="buero-muted">Die Werkstattleitung muss deinen Bürozugang zuvor freigeben.</p></main></body></html>
