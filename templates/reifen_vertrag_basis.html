<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Vertrag widerrufen{% endblock %} · Gärtner</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2ede5;color:#252624;font:16px/1.55 system-ui,-apple-system,sans-serif}header{background:#252624;color:#fffdf9;padding:18px 24px}header a{color:inherit;text-decoration:none;font-weight:700}main{max-width:720px;margin:36px auto;padding:30px;background:#fffdf9;border:1px solid #ded5c8;border-radius:20px}h1{margin:0 0 16px;font-size:clamp(28px,5vw,38px);line-height:1.15}p{margin:12px 0}form{display:grid;gap:17px;margin-top:24px}label{display:grid;gap:6px;font-weight:600}input,select,textarea{width:100%;padding:12px;border:1px solid #b9b0a5;border-radius:9px;background:white;color:inherit;font:inherit}textarea{min-height:105px;resize:vertical}button{justify-self:start;padding:14px 23px;background:#c9281f;color:white;border:0;border-radius:25px;font:600 16px system-ui;cursor:pointer}a{color:#a91c15}small,.hint{color:#66615a;font-size:14px}.error{padding:14px;background:#fff0ee;border:1px solid #dd746b;border-radius:9px;color:#8c1c16}dl{display:grid;grid-template-columns:180px 1fr;gap:10px;margin:24px 0}dt{font-weight:600}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}footer{max-width:720px;margin:0 auto 30px;padding:0 20px;font-size:14px}a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #0b6b67;outline-offset:3px}@media(max-width:600px){main{margin:18px 12px;padding:23px}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:12px}button{width:100%}}
  </style>
</head>
<body>
  <header><a href="/homepage">{{ reifen_vertrag_firma }}</a></header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Fragen oder Erklärung per E-Mail: <a href="mailto:info@auto-lackierzentrum.de">info@auto-lackierzentrum.de</a> · <a href="/datenschutz">Datenschutz</a> · <a href="/impressum">Impressum</a></footer>
</body>
</html>
