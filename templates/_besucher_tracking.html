<script>
  (() => {
    if (window.__gaertnerBesucherErfasst || navigator.webdriver) return;
    window.__gaertnerBesucherErfasst = true;
    const endpoint = {{ (config.get('ANALYTICS_INGEST_URL') or url_for('api_besucher_event')) | tojson }};
    let referrer = '';
    try { referrer = document.referrer ? new URL(document.referrer).hostname : ''; } catch (error) {}
    const website = 'auto-lackierzentrum';
    const seite = window.location.pathname;
    const senden = (eventData, beacon = true) => {
      const payload = JSON.stringify(eventData);
      if (beacon && navigator.sendBeacon) {
        const body = new Blob([payload], { type: 'text/plain;charset=UTF-8' });
        if (navigator.sendBeacon(endpoint, body)) return;
      }
      window.fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload,
        credentials: 'omit',
        mode: 'cors',
        keepalive: true
      }).catch(() => {});
    };
    const aufrufSenden = () => senden({ website, seite, referrer });
    if (document.readyState === 'complete') aufrufSenden();
    else window.addEventListener('load', aufrufSenden, { once: true });

    if (document.querySelector('[data-shop-click]')) {
      document.addEventListener('click', (event) => {
        if (!event.isTrusted || !(event.target instanceof Element)) return;
        const control = event.target.closest('[data-shop-click]');
        if (control) senden({ website, seite, shop_click: control.dataset.shopClick }, false);
      }, true);
    }
  })();
</script>
{% if not besucher_ohne_google_ads %}
<script src="{{ url_for('static', filename='google_ads_tracking.js') }}" data-privacy-url="{{ url_for('datenschutz_seite') }}"></script>
